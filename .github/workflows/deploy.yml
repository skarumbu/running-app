name: Deploy Running App

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Azure login
        run: az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }} && az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install API dependencies
        run: |
          pip install pg8000 -t api/
          pip install "git+https://github.com/skarumbu/shared-logging.git@master#subdirectory=python" -t api/ --no-deps

      - name: Install and build
        run: npm ci && npm run build
        env:
          CI: false
          REACT_APP_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}

      - name: Deploy API to Azure Files
        run: |
          CONN=$(az functionapp config appsettings list --name running-app-prod-api --resource-group running-app-prod-rg --query "[?name=='WEBSITE_CONTENTAZUREFILECONNECTIONSTRING'].value" -o tsv)
          SHARE=$(az functionapp config appsettings list --name running-app-prod-api --resource-group running-app-prod-rg --query "[?name=='WEBSITE_CONTENTSHARE'].value" -o tsv)
          az storage file upload-batch --destination "$SHARE/site/wwwroot" --source api/ --connection-string "$CONN"
          az functionapp restart --name running-app-prod-api --resource-group running-app-prod-rg

      - name: Deploy frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: build
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
